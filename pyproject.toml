[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "narrion"
version = "0.0.1"
description = "A tool designed to support Game Masters during RPG sessions. The application helps manage information about the game world, characters, and events, while also streamlining session organization and gameplay \u2014 both during preparation and throughout the session itself."
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["narrion"]
include = ["pyproject.toml", "narrion/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["narrion"]
force-sort-within-sections = true

